# M0 viewer spike: one-off WebKitGTK load test (PLAN §7). Lives only on spike/viewer-choice.
name: spike-webkitgtk
on:
  push:
    branches: [spike/viewer-choice]
  workflow_dispatch:

jobs:
  bench:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: spike
    steps:
      - uses: actions/checkout@v4
      - name: System libraries for Tauri 2 (WebKitGTK 4.1)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev libxdo-dev libssl-dev xvfb
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - name: Build UI
        working-directory: spike/ui
        run: npm ci && npm run build
      - name: Build app
        working-directory: spike/src-tauri
        run: cargo build --release --features custom-protocol
      - name: Run headless benchmark under Xvfb
        working-directory: spike/src-tauri
        run: SPIKE_BENCH=1 timeout 600 xvfb-run -a -s "-screen 0 1600x1000x24" ./target/release/docent-viewer-spike
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: webkitgtk-results
          path: spike/results/bench-linux-*.json
