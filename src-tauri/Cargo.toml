[package]
name = "docent"
description = "AI-guided code review and exploration"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
# The `_lib` suffix keeps the lib name distinct from the bin name,
# see https://github.com/rust-lang/cargo/issues/8519
name = "docent_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
docent-forge = { path = "../crates/docent-forge" }
docent-store = { path = "../crates/docent-store" }
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", features = [] }
tokio = { version = "1", features = ["process", "sync", "time"] }

[dev-dependencies]
docent-forge = { path = "../crates/docent-forge", features = ["fake"] }
serde_json = "1"
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
wiremock = "0.6"
