# Throwaway M0.5 spike (thenorthnate/docent#4). Never merged to main.
[package]
name = "docent-spike"
version = "0.0.0"
edition = "2021"
publish = false

# Standalone: not part of any future Docent workspace.
[workspace]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "io-util", "sync", "macros", "rt-multi-thread", "time", "fs"] }
# Default features use the OS TLS stack, so a corporate MITM proxy's root CA in the keychain is trusted.
reqwest = { version = "0.12", features = ["json"] }

[dev-dependencies]
tempfile = "3"
