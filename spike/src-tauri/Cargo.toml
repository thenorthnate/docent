# Throwaway M0 viewer spike. Never merged to main.
[package]
name = "docent-viewer-spike"
version = "0.0.0"
edition = "2021"
publish = false

# Standalone: not part of any future Docent workspace.
[workspace]

[features]
# On by default: `cargo run` serves the built UI from ui/dist (run `npm run build` in ui/ first).
# For live reload, start the Vite dev server and use `cargo run --no-default-features`.
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
